<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Miranda Liang — Profile Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     Design tokens
     ============================================================ */
  :root {
    --bg:            #000000;
    --text:          #ffffff;
    --text-muted:    #8e8e93;   /* iOS secondary label */
    --text-dim:      #636366;   /* iOS tertiary label  */
    --link:          #5b8def;   /* profile link + focus */
    --pill-bg:       #ffffff;
    --pill-text:     #000000;
    --hairline:      rgba(255,255,255,0.08);
    --tile-base:     #0d0d0f;

    --radius-tile:   14px;
    --radius-pill:   999px;

    --font-serif: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-sans:  -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;

    --gutter: 16px;
    --tile-gap: 10px;

    --ease-emphasis: cubic-bezier(0.22, 1, 0.36, 1);
    --dur: 260ms;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background:
      radial-gradient(120% 80% at 50% 0%, #1a1a1e 0%, #0b0b0d 45%, #060607 100%);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    color: var(--text);
  }

  /* Stage that centers the phone frame */
  .stage {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 32px 16px;
  }

  /* ============================================================
     Device frame — presentation chrome only (not part of handoff component)
     ============================================================ */
  .device {
    position: relative;
    width: 390px;
    max-width: 100%;
    height: 844px;
    max-height: calc(100dvh - 48px);
    background: var(--bg);
    border-radius: 46px;
    box-shadow:
      0 0 0 10px #1c1c1e,
      0 0 0 11px #313135,
      0 40px 90px -20px rgba(0,0,0,0.85);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 430px) {
    .stage { padding: 0; }
    .device {
      border-radius: 0;
      height: 100dvh;
      max-height: none;
      box-shadow: none;
    }
  }

  /* Status bar */
  .statusbar {
    flex: 0 0 auto;
    height: 54px;
    padding: 18px 30px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .statusbar .glyphs { display: flex; align-items: center; gap: 7px; }
  .statusbar svg { display: block; }

  /* Scroll region */
  .screen {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  /* ============================================================
     Profile header
     ============================================================ */
  .header { text-align: center; padding: 14px 24px 0; }

  .avatar {
    width: 108px; height: 108px;
    margin: 0 auto 14px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 56px; line-height: 1;
    /* macOS alien renders via Apple Color Emoji on Miranda's machine */
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    background:
      radial-gradient(130% 130% at 30% 20%, #3a3f52 0%, #23252f 42%, #14151b 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.10),
      0 8px 26px -12px rgba(0,0,0,0.9);
    user-select: none;
  }

  .name-row {
    display: inline-flex; align-items: center; gap: 8px;
    margin-bottom: 4px;
  }
  .name {
    font-family: var(--font-serif);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 0.2px;
    line-height: 1.1;
  }
  .verified { color: var(--link); flex: 0 0 auto; }

  .meta {
    color: var(--text-muted);
    font-size: 15px;
    margin-bottom: 6px;
  }

  .cta {
    margin: 18px auto 22px;
    display: inline-flex; align-items: center; justify-content: center;
    height: 44px; padding: 0 30px;
    background: var(--link); color: #ffffff;
    font-family: var(--font-sans);
    font-size: 16px; font-weight: 600;
    border: none; border-radius: var(--radius-pill);
    cursor: pointer;
    transition: transform var(--dur) var(--ease-emphasis), opacity var(--dur);
  }
  .cta:hover { opacity: 0.92; }
  .cta:active { transform: scale(0.97); }

  /* ============================================================
     Gallery grid
     ============================================================ */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px var(--tile-gap);
    padding: 4px var(--gutter) 24px;
  }

  .tile {
    display: block;
    text-align: left;
    border: none; background: transparent;
    padding: 0; margin: 0;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .thumb {
    display: block;
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-tile);
    overflow: hidden;
    background: var(--tile-base);
    box-shadow: inset 0 0 0 1px var(--hairline);
    transition: transform var(--dur) var(--ease-emphasis);
  }
  .tile:active .thumb { transform: scale(0.98); }

  .thumb img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  /* When a real photo is missing, the poster underneath carries the tile */
  .thumb img.is-missing { display: none; }

  /* Fallback posters approximating each uploaded frame ------------- */
  .poster { position: absolute; inset: 0; }
  .poster--sunset {
    background:
      radial-gradient(90% 60% at 60% 78%, rgba(240,150,60,0.55), transparent 60%),
      linear-gradient(180deg, #1b2740 0%, #33405c 24%, #6f5a44 52%,
                              #d98a3d 70%, #4a3324 84%, #0d0b0a 100%);
  }
  .poster--sunset::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(2px 2px at 30% 82%, #ff5a3c 0 40%, transparent 41%),
      radial-gradient(2px 2px at 66% 84%, #ffd27a 0 40%, transparent 41%),
      radial-gradient(2px 2px at 74% 80%, #7fe0ff 0 40%, transparent 41%);
  }
  .poster--bokeh {
    background:
      radial-gradient(circle at 22% 30%, rgba(255,190,90,0.95) 0 4%, transparent 7%),
      radial-gradient(circle at 34% 52%, rgba(255,150,60,0.85) 0 4%, transparent 7%),
      radial-gradient(circle at 58% 60%, rgba(120,205,255,0.8) 0 3.5%, transparent 6%),
      radial-gradient(circle at 76% 70%, rgba(255,120,60,0.8) 0 4%, transparent 7%),
      radial-gradient(circle at 46% 78%, rgba(255,230,150,0.85) 0 3.5%, transparent 6%),
      #060608;
  }
  .poster--traffic {
    background:
      radial-gradient(circle at 60% 22%, rgba(90,220,140,0.9) 0 3%, transparent 6%),
      radial-gradient(circle at 30% 58%, rgba(255,70,70,0.85) 0 3.5%, transparent 6%),
      radial-gradient(circle at 52% 62%, rgba(255,255,255,0.85) 0 3%, transparent 6%),
      radial-gradient(circle at 72% 66%, rgba(255,90,80,0.85) 0 3.5%, transparent 6%),
      radial-gradient(circle at 40% 74%, rgba(255,200,120,0.8) 0 3%, transparent 6%),
      #05060a;
  }
  .poster--streaks {
    background:
      linear-gradient(180deg, transparent 30%, rgba(120,210,255,0.9) 30% 62%, transparent 62%) 30% / 7px 100% no-repeat,
      linear-gradient(180deg, transparent 20%, rgba(255,255,255,0.9) 20% 70%, transparent 70%) 46% / 8px 100% no-repeat,
      linear-gradient(180deg, transparent 34%, rgba(255,120,60,0.9) 34% 58%, transparent 58%) 62% / 6px 100% no-repeat,
      linear-gradient(180deg, transparent 26%, rgba(255,210,120,0.85) 26% 66%, transparent 66%) 80% / 7px 100% no-repeat,
      #0a0708;
  }

  .caption { display: block; padding: 10px 2px 0; }
  .caption .title {
    display: block;
    font-size: 16px; font-weight: 600; letter-spacing: 0.1px;
  }
  .caption .sub {
    display: block;
    font-size: 13px; color: var(--text-muted); margin-top: 2px;
  }

  /* ============================================================
     Bottom tab bar (presentation chrome)
     ============================================================ */
  .tabbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-around;
    padding: 10px 24px calc(env(safe-area-inset-bottom, 8px) + 10px);
    border-top: 1px solid var(--hairline);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(18px);
  }
  .tab { width: 40px; height: 40px; display: grid; place-items: center; color: var(--text-muted); }
  .tab.active { color: var(--text); }
  .tab .tabavatar {
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-size: 15px;
    font-family: 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
    background: radial-gradient(130% 130% at 30% 20%, #3a3f52, #14151b);
  }

  /* ============================================================
     Lightbox
     ============================================================ */
  .lightbox {
    position: absolute; inset: 0; z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(24px);
  }
  .lightbox[data-open="true"] { display: flex; }

  .lb-figure {
    position: relative;
    width: 100%; height: 100%;
    padding: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: lb-in var(--dur) var(--ease-emphasis);
  }
  @keyframes lb-in {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }
  .lb-media {
    position: relative;
    width: 84%;
    aspect-ratio: 3 / 2;
    max-height: 62%;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.9);
  }
  .lb-media .poster { position: absolute; inset: 0; width: auto; aspect-ratio: auto; }
  .lb-media img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  .lb-media img.is-missing { display: none; }
  .lb-caption {
    margin-top: 14px; text-align: center;
  }
  .lb-caption .title { font-size: 17px; font-weight: 600; }
  .lb-caption .sub { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
  .lb-counter {
    margin-top: 10px; font-size: 13px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  .lb-btn {
    position: absolute;
    z-index: 20;
    display: grid; place-items: center;
    width: 48px; height: 48px;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,0.10);
    color: #fff; cursor: pointer;
    transition: background var(--dur), transform var(--dur) var(--ease-emphasis);
  }
  .lb-btn:hover { background: rgba(255,255,255,0.2); }
  .lb-btn:active { transform: scale(0.92); }
  .lb-close { top: max(18px, env(safe-area-inset-top)); right: 18px; }
  .lb-prev  { left: 14px;  top: 50%; transform: translateY(-50%); }
  .lb-next  { right: 14px; top: 50%; transform: translateY(-50%); }
  .lb-prev:active { transform: translateY(-50%) scale(0.92); }
  .lb-next:active { transform: translateY(-50%) scale(0.92); }
  @media (max-width: 560px) {
    .lb-prev { left: 8px; } .lb-next { right: 8px; }
    .lb-btn { width: 44px; height: 44px; }
  }

  /* Focus visibility — WCAG 2.4.7 */
  :focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 3px;
    border-radius: 6px;
  }
  .thumb:focus-visible,
  .tile:focus-visible .thumb { outline: 2px solid var(--link); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

  /* ---- Lightbox controller ---- */
  const lb       = document.getElementById("lightbox");
  const lbMedia  = document.getElementById("lbMedia");
  const lbTitle  = document.getElementById("lbTitle");
  const lbSub    = document.getElementById("lbSub");
  const lbCounter= document.getElementById("lbCounter");
  const lbClose  = document.getElementById("lbClose");
  const lbPrev   = document.getElementById("lbPrev");
  const lbNext   = document.getElementById("lbNext");
  const focusable = [lbClose, lbPrev, lbNext];

  let current = 0;
  let lastFocused = null;

  function render(i) {
    const p = PHOTOS[i];
    lbMedia.innerHTML =
      `<span class="poster ${p.poster}"></span>
       <img src="${p.file}" alt="${p.title} — ${p.sub}"
            onerror="this.classList.add('is-missing')" />`;
    lbTitle.textContent = p.title;
    lbSub.textContent = p.sub;
    lbCounter.textContent = `${i + 1} / ${PHOTOS.length}`;
  }

  function openLightbox(i) {
    current = i;
    lastFocused = document.activeElement;
    render(i);
    lb.dataset.open = "true";
    document.body.style.overflow = "hidden";
    lbClose.focus();
  }
  function closeLightbox() {
    lb.dataset.open = "false";
    document.body.style.overflow = "";
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  const next = () => { current = (current + 1) % PHOTOS.length; render(current); };
  const prev = () => { current = (current - 1 + PHOTOS.length) % PHOTOS.length; render(current); };

  lbClose.addEventListener("click", closeLightbox);
  lbNext.addEventListener("click", next);
  lbPrev.addEventListener("click", prev);
  lb.addEventListener("click", (e) => { if (e.target === lb) closeLightbox(); });

  /* Keyboard: Esc / arrows + focus trap */
  document.addEventListener("keydown", (e) => {
    if (lb.dataset.open !== "true") return;
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
    else if (e.key === "Tab") {
      const idx = focusable.indexOf(document.activeElement);
      e.preventDefault();
      const dir = e.shiftKey ? -1 : 1;
      const nextEl = focusable[(idx + dir + focusable.length) % focusable.length] || focusable[0];
      nextEl.focus();
    }
  });

  /* Touch swipe on mobile */
  let touchX = null;
  lb.addEventListener("touchstart", (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) (dx < 0 ? next() : prev());
    touchX = null;
  }, { passive: true });
</script>
</body>
</html>
